name: Health monitoring

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        id: ping
        run: |
          http_status=$(curl -s -o response.json -w "%{http_code}" "${BDPM_SERVICE_URL}/health" || echo "000")
          echo "http_status=$http_status" >> "$GITHUB_OUTPUT"
          body_status=$(jq -r '.status // "unknown"' response.json 2>/dev/null || echo "unknown")
          echo "body_status=$body_status" >> "$GITHUB_OUTPUT"
        env:
          BDPM_SERVICE_URL: ${{ secrets.BDPM_SERVICE_URL }}

      - name: Report status
        uses: actions/github-script@v7
        with:
          script: |
            const httpStatus = "${{ steps.ping.outputs.http_status }}";
            const bodyStatus = "${{ steps.ping.outputs.body_status }}";
            const healthy = httpStatus === "200" && bodyStatus === "ok";
            const label = "health-alert";

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (!healthy) {
              if (openIssues.length === 0) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: "🔴 BDPM Resolver health check failed",
                  labels: [label],
                  body: `HTTP status: ${httpStatus}\nBody status: ${bodyStatus}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                });
              }
              core.setFailed(`Health check failed (http=${httpStatus}, status=${bodyStatus})`);
            } else if (openIssues.length > 0) {
              for (const issue of openIssues) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: "✅ Service de nouveau sain, fermeture automatique.",
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                });
              }
            }
