[project]
name = "bdpm-resolver"
version = "0.1.0"
description = "Résolveur local de noms de médicaments basé sur la BDPM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "rapidfuzz>=3.10,<3.11",
    "unidecode>=1.3,<1.4",
    "httpx>=0.27,<0.28",
    "pydantic>=2.9,<2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]
