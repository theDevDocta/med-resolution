name: CI/CD

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        # Méthode GET conforme à la doc officielle Coolify (deploy webhook) :
        # https://coolify.io/docs/applications/ci-cd/github/actions
        run: |
          curl --fail --show-error --request GET "${COOLIFY_WEBHOOK_URL}" \
            --header "Authorization: Bearer ${COOLIFY_WEBHOOK_TOKEN}"
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
